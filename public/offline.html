<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f4">
  <title>Hors ligne — CinéClub</title>
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; padding: 2rem; text-align: center;
      background: #faf8f4; color: #1c1a17;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    img { width: 96px; height: 96px; }
    h1 { font-size: 1.4rem; margin: 0; }
    p { margin: 0; color: #6b6459; max-width: 22rem; line-height: 1.5; }
    button {
      margin-top: .5rem; padding: .7rem 1.4rem; border: 0; border-radius: 9999px;
      background: #1c1a17; color: #faf8f4; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/icon-192.png" alt="CinéClub">
  <h1>Vous êtes hors ligne</h1>
  <p>Impossible de joindre CinéClub pour l'instant. Vérifiez votre connexion, puis réessayez.</p>
  <button onclick="location.reload()">Réessayer</button>
</body>
</html>
