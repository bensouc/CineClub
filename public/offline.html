<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f4">
  <title>Hors ligne — CinéClub</title>
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; padding: 2rem; text-align: center;
      background: #faf8f4; color: #17130f;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    svg { width: 84px; height: 84px; }
    h1 { font-size: 1.4rem; margin: 0; }
    p { margin: 0; color: #6f665c; max-width: 22rem; line-height: 1.5; }
    button {
      margin-top: .5rem; padding: .7rem 1.4rem; border: 0; border-radius: 9999px;
      background: #17130f; color: #faf8f4; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Icône inline : offline.html doit s'afficher sans aucune requête réseau. -->
  <svg viewBox="0 0 24 24" fill="none" stroke="#17130f" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 8.5a1.5 1.5 0 0 1 1.5-1.5h15A1.5 1.5 0 0 1 21 8.5a2 2 0 0 0 0 4 1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 12.5a2 2 0 0 0 0-4z"/>
    <path d="M9.5 7v10" stroke-dasharray="1.5 2"/>
  </svg>
  <h1>Vous êtes hors ligne</h1>
  <p>Impossible de joindre CinéClub pour l'instant. Vérifiez votre connexion, puis réessayez.</p>
  <button onclick="location.reload()">Réessayer</button>
</body>
</html>
