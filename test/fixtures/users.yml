# Devise users. Password for all of them is "password123".
# stretches is 1 in the test env (see config/initializers/devise.rb), so this is fast.
alice:
  email: alice@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  admin: false

bob:
  email: bob@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  admin: false

admin:
  email: admin@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  admin: true
